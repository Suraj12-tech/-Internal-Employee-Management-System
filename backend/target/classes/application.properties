# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
# Create the database first: CREATE DATABASE ems_db;
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=70741214
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# 'update' auto-creates/updates tables based on our Entity classes.
# In a real production app you'd use migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# In production, put this secret in an environment variable, never in source code.
jwt.secret=${JWT_SECRET:this-is-a-very-long-dev-only-secret-key-change-it-in-production-1234567890}
jwt.expiration-ms=86400000
